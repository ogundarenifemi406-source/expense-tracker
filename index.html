   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expense Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <h1>Expense Tracker</h1>
    <p class="subtitle">Keep track of your spending.</p>

    <section class="expense-form">

      <input
        type="text"
        id="expenseName"
        placeholder="Expense name"
      >

      <input
        type="number"
        id="expenseAmount"
        placeholder="Amount (₦)"
        min="1"
      >

      <select id="expenseCategory">
        <option value="">Choose category</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="School">School</option>
        <option value="Other">Other</option>
      </select>

      <button id="addExpenseBtn">Add Expense</button>

    </section>

    <section class="total">
      <p>Total Spending</p>
      <h2>₦<span id="totalAmount">0</span></h2>
    </section>

    <section class="category-summary">

      <h3>Spending by Category</h3>

      <p>Food: ₦<span id="foodTotal">0</span></p>
      <p>Transport: ₦<span id="transportTotal">0</span></p>
      <p>School: ₦<span id="schoolTotal">0</span></p>
      <p>Other: ₦<span id="otherTotal">0</span></p>

    </section>

    <ul id="expenseList"></ul>

  </main>

  <script src="script.js"></script>

</body>
</html>
